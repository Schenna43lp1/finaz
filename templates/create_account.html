{% extends "base.html" %}

{% block title %}Neues Konto - Finanzverwaltungstool{% endblock %}

{% block content %}
<div class="page-header">
    <h1>➕ Neues Konto erstellen</h1>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('create_account') }}">
        <div class="form-group">
            <label for="name">Kontoname *</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="account_type">Kontotyp *</label>
            <select class="form-control" id="account_type" name="account_type" required>
                <option value="Girokonto">Girokonto</option>
                <option value="Sparkonto">Sparkonto</option>
                <option value="Kreditkarte">Kreditkarte</option>
                <option value="Bargeld">Bargeld</option>
                <option value="Sonstiges">Sonstiges</option>
            </select>
        </div>

        <div class="form-group">
            <label for="balance">Anfangssaldo</label>
            <input type="number" class="form-control" id="balance" name="balance" 
                   step="0.01" value="0.00">
        </div>

        <div class="form-group">
            <label for="currency">Währung</label>
            <select class="form-control" id="currency" name="currency">
                <option value="EUR" selected>EUR</option>
                <option value="USD">USD</option>
                <option value="GBP">GBP</option>
                <option value="CHF">CHF</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Beschreibung (optional)</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
        </div>

        <div class="action-buttons">
            <button type="submit" class="btn btn-primary">Konto erstellen</button>
            <a href="{{ url_for('accounts') }}" class="btn btn-secondary">Abbrechen</a>
        </div>
    </form>
</div>
{% endblock %}
