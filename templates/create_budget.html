{% extends "base.html" %}

{% block title %}Neues Budget - Finanzverwaltungstool{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Neues Budget erstellen</h1>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('create_budget') }}">
        <div class="form-group">
            <label for="category_id">Ausgabe-Kategorie *</label>
            <select class="form-control" id="category_id" name="category_id" required>
                <option value="">-- Kategorie auswählen --</option>
                {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.name }} - {{ category.description }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Budget-Betrag *</label>
            <input type="number" class="form-control" id="amount" name="amount" step="0.01" min="0.01" required>
        </div>

        <div class="form-group">
            <label for="period_start">Startdatum *</label>
            <input type="date" class="form-control" id="period_start" name="period_start" value="{{ today }}" required>
        </div>

        <div class="form-group">
            <label for="period_end">Enddatum *</label>
            <input type="date" class="form-control" id="period_end" name="period_end" required>
        </div>

        <div class="action-buttons">
            <button type="submit" class="btn btn-primary">Budget erstellen</button>
            <a href="{{ url_for('budgets') }}" class="btn btn-secondary">Abbrechen</a>
        </div>
    </form>
</div>

<script>
    // Set end date to end of current month by default
    document.addEventListener('DOMContentLoaded', function () {
        const periodEnd = document.getElementById('period_end');
        if (!periodEnd.value) {
            const today = new Date();
            const lastDay = new Date(today.getFullYear(), today.getMonth() + 1, 0);
            const dateStr = lastDay.toISOString().split('T')[0];
            periodEnd.value = dateStr;
        }
    });
</script>
{% endblock %}
