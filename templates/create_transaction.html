{% extends "base.html" %}

{% block title %}Neue Transaktion - Finanzverwaltungstool{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Neue Transaktion hinzufügen</h1>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('create_transaction') }}">
        <div class="form-group">
            <label for="account_id">Konto *</label>
            <select class="form-control" id="account_id" name="account_id" required>
                <option value="">-- Konto auswählen --</option>
                {% for account in accounts %}
                <option value="{{ account.id }}">
                    {{ account.name }} ({{ "%.2f"|format(account.balance) }} {{ account.currency }})
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="transaction_type">Transaktionstyp *</label>
            <select class="form-control" id="transaction_type" name="transaction_type" required
                onchange="updateCategories()">
                <option value="">-- Typ auswählen --</option>
                <option value="Einnahme">Einnahme</option>
                <option value="Ausgabe">Ausgabe</option>
            </select>
        </div>

        <div class="form-group">
            <label for="category_id">Kategorie *</label>
            <select class="form-control" id="category_id" name="category_id" required>
                <option value="">-- Zuerst Typ auswählen --</option>
                {% for category in categories %}
                <option value="{{ category.id }}" data-type="{{ category.category_type }}">
                    {{ category.name }} - {{ category.description }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="amount">Betrag *</label>
            <input type="number" class="form-control" id="amount" name="amount" step="0.01" min="0.01" required>
        </div>

        <div class="form-group">
            <label for="transaction_date">Datum *</label>
            <input type="date" class="form-control" id="transaction_date" name="transaction_date" value="{{ today }}"
                required>
        </div>

        <div class="form-group">
            <label for="description">Beschreibung (optional)</label>
            <textarea class="form-control" id="description" name="description" rows="3"></textarea>
        </div>

        <div class="action-buttons">
            <button type="submit" class="btn btn-primary">Transaktion hinzufügen</button>
            <a href="{{ url_for('transactions') }}" class="btn btn-secondary">Abbrechen</a>
        </div>
    </form>
</div>

<script>
    function updateCategories() {
        const transactionType = document.getElementById('transaction_type').value;
        const categorySelect = document.getElementById('category_id');
        const options = categorySelect.querySelectorAll('option');

        // Reset and disable category select if no type selected
        if (!transactionType) {
            categorySelect.value = '';
            categorySelect.disabled = true;
            options.forEach(option => {
                if (option.value) option.style.display = 'none';
            });
            options[0].textContent = '-- Zuerst Typ auswählen --';
            return;
        }

        // Enable and filter categories
        categorySelect.disabled = false;
        categorySelect.value = '';
        options[0].textContent = '-- Kategorie auswählen --';

        options.forEach(option => {
            if (option.value) {
                const optionType = option.getAttribute('data-type');
                if (optionType === transactionType) {
                    option.style.display = '';
                } else {
                    option.style.display = 'none';
                }
            }
        });
    }

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function () {
        updateCategories();
    });
</script>
{% endblock %}
